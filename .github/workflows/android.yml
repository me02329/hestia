name: Android safety checks
on:
  push:
    paths: ["app/**", "tools/**", "tests/**", "build.sh", "config.example.properties", ".github/workflows/android.yml"]
  pull_request:
    paths: ["app/**", "tools/**", "tests/**", "build.sh", "config.example.properties", ".github/workflows/android.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 -m unittest discover -s tests -v
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - run: ./build.sh
      # The ephemeral CI signing key and configured APK are deliberately not published.
