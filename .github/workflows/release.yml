name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: The tag must match the app's version
        run: grep -q "android:versionName=\"${GITHUB_REF_NAME#v}-safe\"" app/AndroidManifest.xml
      - run: python3 -m unittest discover -s tests -v
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0' > /dev/null
      # Without the real key, build.sh would make a new one, and that APK couldn't update an installed Hestia.
      - name: Restore the signing key
        env:
          KEYSTORE: ${{ secrets.HESTIA_KEYSTORE_B64 }}
          PASS: ${{ secrets.HESTIA_KEYSTORE_PASS }}
        run: |
          test -n "$KEYSTORE" && test -n "$PASS"
          (umask 077; printf '%s' "$KEYSTORE" | base64 -d > hestia-tv.keystore; printf '%s' "$PASS" > hestia-tv.keystore.pass)
      - run: ./build.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Hestia.apk Hestia.apk.sha256 --verify-tag --generate-notes
