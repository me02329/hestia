# Hestia settings. build.sh copies this file to config.properties the first time; edit that one and rebuild.
# No API key is needed: weather (Open-Meteo), photos of the day (Bing) and cyber news (RSS) are all free.

# Your city, for the weather (decimal degrees) and the name shown next to it (empty = no name).
latitude=48.8566
longitude=2.3522
city=

# auto (follows the TV), fr, en or pt. Can also be changed on the TV in Hestia's settings.
language=auto

# C, F, or auto (Fahrenheit when the TV is set to the US)
temperature=C
